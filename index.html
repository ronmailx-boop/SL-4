<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הקראת טקסט</title>

    <meta name="theme-color" content="#7367f0">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #f4f7fa;
            min-height: 100vh;
        }
        textarea { resize: vertical; }
        details > summary { cursor: pointer; list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body>

    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-2xl p-4 mb-4 flex justify-between items-center shadow-sm">
            <div>
                <h1 class="text-xl font-bold text-slate-800">הקראת טקסט</h1>
                <span id="statusTag" class="text-orange-600 bg-orange-50 px-2 py-0.5 rounded-full text-[10px] font-bold mt-1 inline-block">מוכן</span>
            </div>
            <a href="shopping.html" class="p-2 text-indigo-500 bg-indigo-50 rounded-full inline-flex">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
            </a>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-lg mb-4">
            <textarea id="ttsText" dir="rtl" rows="8" placeholder="הדבק כאן טקסט בעברית..." class="w-full p-3 border rounded-xl outline-none"></textarea>
            <div id="ttsHighlightView" dir="rtl" class="hidden w-full p-3 border rounded-xl outline-none whitespace-pre-wrap leading-relaxed overflow-y-auto" style="max-height: 260px;"></div>

            <div id="noVoiceWarning" class="hidden mt-3 text-[12px] text-orange-600 bg-orange-50 rounded-xl p-2">
                לא נמצא קול עברי מותקן בדפדפן/מערכת ההפעלה. ניתן עדיין לנסות להקריא באמצעות הקול המובנה.
            </div>

            <div class="flex gap-3 mt-4">
                <button id="playBtn" onclick="play()" class="flex-1 py-4 bg-[#28c76f] text-white font-bold rounded-xl active:scale-95 transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    הפעלה
                </button>
                <button id="pauseBtn" onclick="togglePause()" disabled class="flex-1 py-4 bg-[#ff9f43] text-white font-bold rounded-xl active:scale-95 transition flex items-center justify-center gap-2 disabled:opacity-40">
                    <svg id="pauseIcon" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                    <span id="pauseLabel">השהיה</span>
                </button>
                <button id="stopBtn" onclick="stop()" disabled class="flex-1 py-4 bg-[#ea5455] text-white font-bold rounded-xl active:scale-95 transition flex items-center justify-center gap-2 disabled:opacity-40">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                    עצירה
                </button>
            </div>
        </div>

        <details class="bg-white p-5 rounded-3xl shadow-sm">
            <summary class="font-bold text-slate-700 flex items-center justify-between">
                הגדרות קול
                <span class="text-slate-400">▾</span>
            </summary>
            <div class="mt-4">
                <label class="block text-[12px] text-slate-500 mb-1">קול</label>
                <select id="voiceSelect" class="w-full p-3 border rounded-xl outline-none mb-4"></select>

                <label class="block text-[12px] text-slate-500 mb-1">קצב דיבור: <span id="rateValue">1</span></label>
                <input id="rateInput" type="range" min="0.5" max="1.5" step="0.1" value="1" class="w-full">
            </div>
        </details>
    </div>

    <script>
        const ttsText = document.getElementById('ttsText');
        const ttsHighlightView = document.getElementById('ttsHighlightView');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const pauseIcon = document.getElementById('pauseIcon');
        const pauseLabel = document.getElementById('pauseLabel');
        const stopBtn = document.getElementById('stopBtn');
        const statusTag = document.getElementById('statusTag');
        const voiceSelect = document.getElementById('voiceSelect');
        const noVoiceWarning = document.getElementById('noVoiceWarning');
        const rateInput = document.getElementById('rateInput');
        const rateValue = document.getElementById('rateValue');

        const TEXT_KEY = 'TTS_TEXT_V1';
        ttsText.value = localStorage.getItem(TEXT_KEY) || '';
        ttsText.addEventListener('input', () => localStorage.setItem(TEXT_KEY, ttsText.value));

        rateInput.addEventListener('input', () => { rateValue.textContent = rateInput.value; });

        const supported = 'speechSynthesis' in window;
        const synth = supported ? window.speechSynthesis : null;

        let chunks = [];
        let chunkOffsets = [];
        let originalText = '';
        let stopRequested = false;
        let pauseRequested = false;
        let isSpeaking = false;
        let isPaused = false;
        let lastKnownAbsOffset = 0;
        let boundaryReceivedForChunk = false;
        let simHighlightTimer = null;
        let speakGeneration = 0;

        function setStatus(text, className) {
            statusTag.textContent = text;
            statusTag.className = className + " px-2 py-0.5 rounded-full text-[10px] font-bold mt-1 inline-block";
        }

        function updatePauseButton() {
            if (isPaused) {
                pauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                pauseLabel.textContent = 'המשך';
            } else {
                pauseIcon.innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
                pauseLabel.textContent = 'השהיה';
            }
        }

        function updateUI() {
            if (!supported) {
                setStatus('הדפדפן אינו תומך בהקראה', 'text-gray-500 bg-gray-100');
                playBtn.disabled = true;
                playBtn.classList.add('opacity-40');
                pauseBtn.disabled = true;
                stopBtn.disabled = true;
                return;
            }
            stopBtn.disabled = !isSpeaking;
            pauseBtn.disabled = !isSpeaking;
            updatePauseButton();
            ttsText.classList.toggle('hidden', isSpeaking);
            ttsHighlightView.classList.toggle('hidden', !isSpeaking);
            if (isPaused) setStatus('מושהה', 'text-amber-600 bg-amber-50');
            else if (isSpeaking) setStatus('מקריא...', 'text-green-600 bg-green-50');
            else setStatus('מוכן', 'text-orange-600 bg-orange-50');
        }

        function loadVoices() {
            if (!supported) return;
            const voices = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('he'));
            const previousValue = voiceSelect.value;
            voiceSelect.innerHTML = '';

            if (voices.length === 0) {
                voiceSelect.classList.add('hidden');
                noVoiceWarning.classList.remove('hidden');
                return;
            }

            voiceSelect.classList.remove('hidden');
            noVoiceWarning.classList.add('hidden');
            voices.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${v.name} (${v.lang})`;
                voiceSelect.appendChild(opt);
            });
            if (previousValue && Number(previousValue) < voices.length) voiceSelect.value = previousValue;
            voiceSelect.dataset.voices = JSON.stringify(voices.map(v => v.name));
        }

        function getSelectedVoice() {
            if (!supported) return null;
            const voices = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('he'));
            const idx = Number(voiceSelect.value);
            return voices[idx] || null;
        }

        function splitIntoChunks(text) {
            const result = [];
            const sentenceRe = /[^.!?\n]+[.!?\n]*/g;
            let m;
            while ((m = sentenceRe.exec(text)) !== null) {
                const raw = m[0];
                const leadingWs = raw.match(/^\s*/)[0].length;
                const trimmed = raw.trim();
                if (!trimmed) continue;
                const sentenceStart = m.index + leadingWs;
                if (trimmed.length > 200) {
                    let cursor = 0;
                    (trimmed.match(/.{1,200}(,|\s|$)/g) || [trimmed]).forEach(part => {
                        const partLeadingWs = part.match(/^\s*/)[0].length;
                        const partTrimmed = part.trim();
                        if (partTrimmed) {
                            const idx = trimmed.indexOf(part, cursor);
                            result.push({ text: partTrimmed, start: sentenceStart + idx + partLeadingWs });
                        }
                        cursor += part.length;
                    });
                } else {
                    result.push({ text: trimmed, start: sentenceStart });
                }
            }
            return result;
        }

        function renderHighlight(start, len) {
            if (!originalText) return;
            const end = Math.min(start + Math.max(len, 1), originalText.length);
            const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            ttsHighlightView.innerHTML = esc(originalText.slice(0, start)) +
                '<span id="curWordSpan" class="bg-amber-200 rounded px-0.5">' + esc(originalText.slice(start, end)) + '</span>' +
                esc(originalText.slice(end));
            const span = document.getElementById('curWordSpan');
            if (span) span.scrollIntoView({ block: 'nearest' });
        }

        function stopSimulatedHighlight() {
            if (simHighlightTimer) {
                clearTimeout(simHighlightTimer);
                simHighlightTimer = null;
            }
        }

        function estimateWordDurationMs(word, rate) {
            return (150 + word.length * 60) / (rate || 1);
        }

        // Many Hebrew voices never fire utterance.onboundary (word-boundary events
        // are voice/engine-dependent, not guaranteed by the spec). When that happens
        // we approximate word-by-word timing ourselves so highlighting still moves,
        // instead of leaving the text unhighlighted for the whole chunk.
        function startSimulatedHighlight(chunkText, chunkOffset, rate, myGen) {
            stopSimulatedHighlight();
            const words = [];
            const re = /\S+/g;
            let m;
            while ((m = re.exec(chunkText)) !== null) {
                words.push({ start: chunkOffset + m.index, len: m[0].length, text: m[0] });
            }
            let idx = 0;
            function tick() {
                if (myGen !== speakGeneration || idx >= words.length) { simHighlightTimer = null; return; }
                const w = words[idx];
                lastKnownAbsOffset = w.start;
                renderHighlight(w.start, w.len);
                idx++;
                simHighlightTimer = setTimeout(tick, estimateWordDurationMs(w.text, rate));
            }
            tick();
        }

        function speakChunk(i) {
            if (stopRequested || pauseRequested) {
                updateUI();
                return;
            }
            if (i >= chunks.length) {
                stopSimulatedHighlight();
                isSpeaking = false;
                isPaused = false;
                updateUI();
                return;
            }
            const myGen = ++speakGeneration;
            const utterance = new SpeechSynthesisUtterance(chunks[i]);
            utterance.lang = 'he-IL';
            const voice = getSelectedVoice();
            if (voice) utterance.voice = voice;
            const rate = parseFloat(rateInput.value) || 1;
            utterance.rate = rate;

            boundaryReceivedForChunk = false;
            lastKnownAbsOffset = chunkOffsets[i];
            stopSimulatedHighlight();

            utterance.onstart = () => {
                setTimeout(() => {
                    if (myGen !== speakGeneration) return;
                    if (!boundaryReceivedForChunk && !stopRequested && !pauseRequested) {
                        startSimulatedHighlight(chunks[i], chunkOffsets[i], rate, myGen);
                    }
                }, 400);
            };
            utterance.onboundary = (event) => {
                if (myGen !== speakGeneration) return;
                if (event.name === 'sentence') return;
                boundaryReceivedForChunk = true;
                stopSimulatedHighlight();
                const absStart = chunkOffsets[i] + event.charIndex;
                const len = event.charLength > 0 ? event.charLength : ((originalText.slice(absStart).match(/^\S+/) || [''])[0].length || 1);
                lastKnownAbsOffset = absStart;
                renderHighlight(absStart, len);
            };
            utterance.onend = () => {
                if (myGen !== speakGeneration) return;
                stopSimulatedHighlight();
                if (pauseRequested) { pauseRequested = false; updateUI(); return; }
                speakChunk(i + 1);
            };
            utterance.onerror = (e) => {
                if (myGen !== speakGeneration) return;
                stopSimulatedHighlight();
                if (pauseRequested) { pauseRequested = false; updateUI(); return; }
                if (e.error !== 'interrupted' && e.error !== 'canceled') console.warn('TTS error', e.error);
                speakChunk(i + 1);
            };
            synth.speak(utterance);
        }

        function play() {
            if (!supported) return;
            loadVoices();
            const text = ttsText.value.trim();
            if (!text) {
                ttsText.classList.add('border-red-400');
                setTimeout(() => ttsText.classList.remove('border-red-400'), 600);
                return;
            }
            synth.cancel();
            stopSimulatedHighlight();
            speakGeneration++;
            stopRequested = false;
            pauseRequested = false;
            isPaused = false;
            originalText = text;
            const built = splitIntoChunks(text);
            chunks = built.map(c => c.text);
            chunkOffsets = built.map(c => c.start);
            lastKnownAbsOffset = 0;
            isSpeaking = true;
            ttsHighlightView.textContent = originalText;
            updateUI();
            speakChunk(0);
        }

        function stop() {
            if (!supported) return;
            stopRequested = true;
            pauseRequested = false;
            speakGeneration++;
            stopSimulatedHighlight();
            synth.cancel();
            isSpeaking = false;
            isPaused = false;
            updateUI();
        }

        // Native speechSynthesis.pause()/resume() is unreliable across browsers
        // (notably Chrome with network-based voices, where resume() can silently
        // no-op forever). Instead we cancel the in-flight utterance and, on resume,
        // re-speak the remaining text from the last known word position - this only
        // relies on cancel()/speak(), which are the two well-supported operations.
        function pause() {
            if (!supported || !isSpeaking || isPaused) return;
            pauseRequested = true;
            speakGeneration++;
            stopSimulatedHighlight();
            synth.cancel();
            isPaused = true;
            updateUI();
        }

        function resume() {
            if (!supported || !isSpeaking || !isPaused) return;
            const remaining = originalText.slice(lastKnownAbsOffset);
            if (!remaining.trim()) {
                isSpeaking = false;
                isPaused = false;
                updateUI();
                return;
            }
            const built = splitIntoChunks(remaining);
            chunks = built.map(c => c.text);
            chunkOffsets = built.map(c => c.start + lastKnownAbsOffset);
            stopRequested = false;
            pauseRequested = false;
            isPaused = false;
            updateUI();
            speakChunk(0);
        }

        function togglePause() {
            if (isPaused) resume(); else pause();
        }

        if (supported) {
            loadVoices();
            synth.onvoiceschanged = loadVoices;
        }
        updateUI();
    </script>
</body>
</html>

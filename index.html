<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>רשימת קניות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f4f7fa; padding-bottom: 220px; }
        
        .bottom-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: #7367f0; z-index: 1000; padding: 15px 10px 40px 10px; border-radius: 40px 40px 0 0; 
        }

        .item-card {
            background: white; border-radius: 25px; padding: 15px; margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; flex-direction: column;
        }

        .card-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        /* עיצוב כפתורי כמות */
        .controls-group {
            display: flex; align-items: center; background: #f8f9fa; border: 1px solid #eee;
            border-radius: 18px; padding: 2px 10px; gap: 10px; position: relative;
        }

        /* הפח האדום מעל המינוס */
        .del-badge {
            position: absolute; top: -14px; left: 6px; color: #ea5455;
            background: white; border-radius: 50%; padding: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 3000; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="priceModal" class="modal-overlay">
        <div class="bg-white w-80 p-6 rounded-3xl text-center shadow-2xl">
            <h2 class="text-lg font-bold mb-4 text-indigo-600">עדכון מחיר</h2>
            <input type="number" id="newPriceInput" inputmode="decimal" class="w-full p-3 border rounded-xl mb-4 text-center text-xl font-bold">
            <div class="flex gap-3">
                <button onclick="confirmPriceUpdate()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl">עדכן</button>
                <button onclick="closePriceModal()" class="flex-1 py-3 bg-gray-100 font-bold rounded-xl">ביטול</button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-3xl p-5 mb-5 flex justify-between items-center shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">הרשימה שלי</h1>
                <span id="statusTag" class="text-orange-600 bg-orange-50 px-3 py-0.5 rounded-full text-[10px] font-bold mt-1 inline-block">מצב עריכה</span>
            </div>
            <div class="text-slate-400"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg></div>
        </div>

        <div id="itemsList" class="space-y-3"></div>
    </div>

    <div class="bottom-bar text-white">
        <div class="flex justify-around mb-5 px-4">
            <div class="text-center">
                <div class="text-[10px] opacity-70">שולם</div>
                <div class="text-xl font-bold">₪<span id="paidSum">0.00</span></div>
            </div>
            <div class="w-px bg-white/20 h-8 self-center"></div>
            <div class="text-center">
                <div class="text-[10px] opacity-70">סה"כ</div>
                <div class="text-xl font-bold">₪<span id="totalSum">0.00</span></div>
            </div>
        </div>
        
        <div class="flex items-center justify-around px-4">
            <button id="lockBtn" onclick="toggleLock()" class="w-14 h-14 bg-[#48a9f8] rounded-full flex items-center justify-center shadow-lg"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg></button>
            <button onclick="addItemPrompt()" class="w-20 h-20 bg-[#28c76f] rounded-full flex items-center justify-center shadow-2xl border-4 border-white/20"><svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="4" d="M12 4v16m8-8H4"></path></svg></button>
            <button onclick="clearList()" class="w-14 h-14 bg-[#ea5455] rounded-full flex items-center justify-center shadow-lg"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
        </div>
    </div>

    <script>
        let shoppingList = JSON.parse(localStorage.getItem('LIST_V4')) || [
            { id: '1', name: 'לחם', unitPrice: 6.00, qty: 1, checked: false }
        ];
        let isLocked = false;
        let currentEditIndex = null;

        function render() {
            const container = document.getElementById('itemsList');
            container.innerHTML = '';
            
            shoppingList.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "item-card";
                div.innerHTML = `
                    <div class="card-row mb-3">
                        <span class="text-xl font-bold text-slate-800 ${item.checked ? 'line-through text-slate-300' : ''}">${item.name}</span>
                        <span onclick="openPriceModal(${index})" class="text-lg font-bold text-indigo-600">₪${(item.unitPrice * item.qty).toFixed(2)}</span>
                    </div>
                    <div class="card-row">
                        <div class="flex items-center gap-4">
                            <div class="controls-group">
                                <div onclick="removeItem(${index})" class="del-badge cursor-pointer">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </div>
                                <button onclick="updateQty(${index}, -1)" class="text-red-500 text-2xl font-bold">-</button>
                                <span class="text-lg font-bold text-slate-700 min-w-[20px] text-center">${item.qty}</span>
                                <button onclick="updateQty(${index}, 1)" class="text-green-500 text-2xl font-bold">+</button>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${index})" class="w-7 h-7 rounded-lg accent-indigo-600">
                            <div class="drag-handle text-slate-300 text-xl ${isLocked ? 'hidden' : ''}">⠿</div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
            calculate();
        }

        function addItemPrompt() {
            const name = prompt("שם המוצר:");
            if (name) {
                const price = parseFloat(prompt("מחיר:", "0")) || 0;
                shoppingList.push({ id: Date.now().toString(), name, unitPrice: price, qty: 1, checked: false });
                save();
            }
        }

        function calculate() {
            const total = shoppingList.reduce((acc, i) => acc + (i.unitPrice * i.qty), 0);
            const paid = shoppingList.filter(i => i.checked).reduce((acc, i) => acc + (i.unitPrice * i.qty), 0);
            document.getElementById('totalSum').innerText = total.toFixed(2);
            document.getElementById('paidSum').innerText = paid.toFixed(2);
        }

        function toggleCheck(index) { shoppingList[index].checked = !shoppingList[index].checked; save(); }
        function updateQty(index, val) { if(shoppingList[index].qty + val >= 1) { shoppingList[index].qty += val; save(); } }
        function removeItem(index) { shoppingList.splice(index, 1); save(); }
        function clearList() { if(confirm("למחוק הכל?")) { shoppingList = []; save(); } }
        function save() { localStorage.setItem('LIST_V4', JSON.stringify(shoppingList)); render(); }
        
        function openPriceModal(index) { currentEditIndex = index; document.getElementById('priceModal').style.display='flex'; }
        function closePriceModal() { document.getElementById('priceModal').style.display='none'; }
        function confirmPriceUpdate() { 
            shoppingList[currentEditIndex].unitPrice = parseFloat(document.getElementById('newPriceInput').value) || 0; 
            closePriceModal(); save(); 
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('statusTag').innerText = isLocked ? "נעול" : "מצב עריכה";
            render();
        }

        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>רשימת קניות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f4f7fa; padding-bottom: 120px; overflow-x: hidden; }
        
        /* הבר התחתון המוקטן */
        .bottom-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: #7367f0; z-index: 1000; 
            padding: 10px 10px 20px 10px; /* הוקטן בחצי */
            border-radius: 30px 30px 0 0; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
        }

        .item-card {
            background: white; border-radius: 20px; padding: 12px 16px; margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column;
            border: 1px solid #eee;
        }

        .card-row { display: flex; align-items: center; width: 100%; gap: 10px; }
        
        .drag-handle { cursor: grab; color: #cbd5e1; font-size: 20px; user-select: none; padding: 5px; }

        .qty-controls {
            display: flex; align-items: center; background: #f8f9fa; 
            border: 1px solid #eee; border-radius: 12px; padding: 2px 8px; gap: 10px;
        }

        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 3000; align-items: center; justify-content: center;
        }
        
        .sortable-ghost { opacity: 0.3; background: #e0e7ff; }
    </style>
</head>
<body>

    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-2xl p-4 mb-4 flex justify-between items-center shadow-sm">
            <h1 class="text-xl font-bold text-slate-800">הרשימה שלי</h1>
            <span id="statusTag" class="text-orange-600 bg-orange-50 px-2 py-0.5 rounded-full text-[10px] font-bold">מצב עריכה</span>
        </div>

        <div id="itemsList" class="space-y-2"></div>
    </div>

    <div class="bottom-bar text-white">
        <div class="flex justify-around items-center">
            <div class="text-center">
                <div class="text-[9px] opacity-70">סה"כ</div>
                <div class="text-lg font-bold">₪<span id="totalSum">0.00</span></div>
            </div>

            <button onclick="addItemPrompt()" class="w-14 h-14 bg-[#28c76f] rounded-full flex items-center justify-center shadow-lg border-2 border-white/20 active:scale-95 transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
            </button>

            <div class="text-center">
                <div class="text-[9px] opacity-70">שולם</div>
                <div class="text-lg font-bold">₪<span id="paidSum">0.00</span></div>
            </div>
        </div>
        
        <div class="flex justify-center gap-8 mt-2">
            <button onclick="toggleLock()" class="text-white/80 hover:text-white transition">
                <svg id="lockIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
            </button>
            <button onclick="clearList()" class="text-white/80 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
        </div>
    </div>

    <script>
        let shoppingList = JSON.parse(localStorage.getItem('LIST_V5')) || [
            { id: '1', name: 'לחם', unitPrice: 6.00, qty: 1, checked: false }
        ];
        let isLocked = false;
        let sortableInstance = null;

        function render() {
            const container = document.getElementById('itemsList');
            container.innerHTML = '';
            
            shoppingList.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "item-card";
                div.dataset.id = item.id;
                div.innerHTML = `
                    <div class="card-row">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${index})" class="w-6 h-6 rounded accent-indigo-600">
                        
                        <div class="flex-grow flex items-center gap-2">
                            <span class="text-lg font-bold text-slate-800 ${item.checked ? 'line-through text-slate-300' : ''}">${item.name}</span>
                            <button onclick="removeItem(${index})" class="text-red-400 hover:text-red-600">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>

                        <span class="text-md font-bold text-indigo-600">₪${(item.unitPrice * item.qty).toFixed(2)}</span>
                    </div>

                    <div class="card-row mt-3 justify-between">
                        <div class="qty-controls">
                            <button onclick="updateQty(${index}, -1)" class="text-red-500 font-bold px-2">-</button>
                            <span class="font-bold text-slate-700">${item.qty}</span>
                            <button onclick="updateQty(${index}, 1)" class="text-green-500 font-bold px-2">+</button>
                        </div>
                        <div class="drag-handle ${isLocked ? 'hidden' : ''}">⠿</div>
                    </div>
                `;
                container.appendChild(div);
            });
            calculate();
            initSort();
        }

        function initSort() {
            const el = document.getElementById('itemsList');
            if (sortableInstance) sortableInstance.destroy();
            if (!isLocked) {
                sortableInstance = Sortable.create(el, {
                    handle: '.drag-handle',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: (evt) => {
                        const movedItem = shoppingList.splice(evt.oldIndex, 1)[0];
                        shoppingList.splice(evt.newIndex, 0, movedItem);
                        localStorage.setItem('LIST_V5', JSON.stringify(shoppingList));
                    }
                });
            }
        }

        function addItemPrompt() {
            const name = prompt("שם המוצר:");
            if (name) {
                const price = parseFloat(prompt("מחיר:", "0")) || 0;
                shoppingList.push({ id: Date.now().toString(), name, unitPrice: price, qty: 1, checked: false });
                save();
            }
        }

        function calculate() {
            const total = shoppingList.reduce((acc, i) => acc + (i.unitPrice * i.qty), 0);
            const paid = shoppingList.filter(i => i.checked).reduce((acc, i) => acc + (i.unitPrice * i.qty), 0);
            document.getElementById('totalSum').innerText = total.toFixed(2);
            document.getElementById('paidSum').innerText = paid.toFixed(2);
        }

        function toggleCheck(index) { shoppingList[index].checked = !shoppingList[index].checked; save(); }
        function updateQty(index, val) { if(shoppingList[index].qty + val >= 1) { shoppingList[index].qty += val; save(); } }
        function removeItem(index) { shoppingList.splice(index, 1); save(); }
        function clearList() { if(confirm("למחוק הכל?")) { shoppingList = []; save(); } }
        function save() { localStorage.setItem('LIST_V5', JSON.stringify(shoppingList)); render(); }
        
        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('statusTag').innerText = isLocked ? "נעול" : "מצב עריכה";
            render();
        }

        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>רשימת קניות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f8fafc; padding-bottom: 220px; overflow-x: hidden; }
        
        /* הבר התחתון הסגול */
        .bottom-bar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: #7367f0; 
            z-index: 1000; padding: 15px 10px 35px 10px; border-radius: 45px 45px 0 0; 
            box-shadow: 0 -8px 25px rgba(0,0,0,0.15);
        }

        /* כרטיס מוצר לפי התמונה */
        .item-card {
            background: white;
            border-radius: 35px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-bottom { display: flex; align-items: center; gap: 15px; }

        /* כפתורי כמות */
        .qty-box {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 20px;
            padding: 5px 10px;
            gap: 15px;
            position: relative;
        }

        .delete-item-btn {
            position: absolute; top: -15px; right: 0px;
            color: #ea5455; background: white; border-radius: 50%; padding: 2px;
        }

        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(2px); 
        }

        .sortable-ghost { opacity: 0.2; }
    </style>
</head>
<body>

    <div id="customModal" class="modal-overlay">
        <div class="bg-white w-80 p-6 rounded-3xl text-center shadow-2xl">
            <h2 class="text-xl font-bold mb-4">למחוק הכל?</h2>
            <div class="flex gap-3">
                <button onclick="confirmClearAll()" class="flex-1 py-3 bg-red-500 text-white font-bold rounded-xl">מחק</button>
                <button onclick="closeDeleteModal()" class="flex-1 py-3 bg-gray-100 font-bold rounded-xl">ביטול</button>
            </div>
        </div>
    </div>

    <div id="priceModal" class="modal-overlay">
        <div class="bg-white w-80 p-6 rounded-3xl text-center shadow-2xl">
            <h2 class="text-lg font-bold mb-4 text-indigo-600">עדכון מחיר</h2>
            <input type="number" id="newPriceInput" inputmode="decimal" class="w-full p-3 border rounded-xl mb-4 text-center text-xl font-bold">
            <div class="flex gap-3">
                <button onclick="confirmPriceUpdate()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl">עדכן</button>
                <button onclick="closePriceModal()" class="flex-1 py-3 bg-gray-100 font-bold rounded-xl">ביטול</button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-3xl p-6 mb-6 flex justify-between items-center shadow-sm">
            <div class="flex flex-col">
                <h1 class="text-4xl font-bold text-gray-800">הרשימה שלי</h1>
                <span id="statusTag" class="text-orange-500 bg-orange-50 px-3 py-1 rounded-full text-xs font-bold w-fit mt-1">מצב עריכה</span>
            </div>
            <div class="text-gray-400"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg></div>
        </div>

        <div id="inputForm" class="hidden bg-white p-5 rounded-3xl shadow-lg mb-4 border-2 border-indigo-400">
            <input type="text" id="itemName" placeholder="שם המוצר" class="w-full p-3 border rounded-xl mb-2 outline-none">
            <input type="number" id="itemPrice" inputmode="decimal" placeholder="מחיר" class="w-full p-3 border rounded-xl mb-3 outline-none">
            <div class="flex gap-2">
                <button onclick="addItem()" class="flex-1 bg-green-500 text-white py-3 rounded-xl font-bold">הוסף</button>
                <button onclick="closeForm()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold">סגור</button>
            </div>
        </div>

        <div id="itemsList"></div>
        <div id="emptyMsg" class="text-center py-20 text-gray-400 text-lg">אין מוצרים... 🛒</div>
    </div>

    <div class="bottom-bar text-white">
        <div class="flex justify-around mb-6 px-6">
            <div class="text-center">
                <div class="text-xs opacity-70">שולם</div>
                <div class="text-3xl font-bold">₪<span id="paidSum">0.00</span></div>
            </div>
            <div class="w-px bg-white/20 h-10 self-center"></div>
            <div class="text-center">
                <div class="text-xs opacity-70">סה"כ</div>
                <div class="text-3xl font-bold">₪<span id="totalSum">0.00</span></div>
            </div>
        </div>
        
        <div class="flex items-center justify-around">
            <button id="lockBtn" onclick="toggleLock()" class="w-16 h-16 bg-[#48a9f8] rounded-full flex items-center justify-center shadow-lg"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg></button>
            <button onclick="openForm()" class="w-24 h-24 bg-[#28c76f] rounded-full flex items-center justify-center shadow-2xl border-4 border-white/20"><svg class="w-14 h-14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="4" d="M12 4v16m8-8H4"></path></svg></button>
            <button onclick="openDeleteModal()" class="w-16 h-16 bg-[#ea5455] rounded-full flex items-center justify-center shadow-lg"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
        </div>
    </div>

    <script>
        let shoppingList = JSON.parse(localStorage.getItem('LIST_FINAL_V1')) || [];
        let isLocked = false;
        let currentEditIndex = null;
        let sortableInstance = null;

        function openForm() { document.getElementById('inputForm').classList.toggle('hidden'); document.getElementById('itemName').focus(); }
        function closeForm() { document.getElementById('inputForm').classList.add('hidden'); }
        function openDeleteModal() { if (shoppingList.length > 0) document.getElementById('customModal').style.display = 'flex'; }
        function closeDeleteModal() { document.getElementById('customModal').style.display = 'none'; }
        function confirmClearAll() { shoppingList = []; saveAndRender(); closeDeleteModal(); }

        function openPriceModal(index) {
            currentEditIndex = index;
            document.getElementById('newPriceInput').value = shoppingList[index].unitPrice;
            document.getElementById('priceModal').style.display = 'flex';
        }
        function closePriceModal() { document.getElementById('priceModal').style.display = 'none'; }
        function confirmPriceUpdate() {
            shoppingList[currentEditIndex].unitPrice = parseFloat(document.getElementById('newPriceInput').value) || 0;
            saveAndRender(); closePriceModal();
        }

        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value) || 0;
            if (!name) return;
            shoppingList.push({ id: Date.now().toString(), name, unitPrice: price, qty: 1, checked: false });
            saveAndRender();
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            closeForm();
        }

        function render() {
            const container = document.getElementById('itemsList');
            container.innerHTML = '';
            document.getElementById('emptyMsg').style.display = shoppingList.length ? 'none' : 'block';
            
            shoppingList.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "item-card";
                div.dataset.id = item.id;
                div.innerHTML = `
                    <div class="card-top">
                        <span onclick="openPriceModal(${index})" class="text-3xl font-bold text-indigo-600">₪${(item.unitPrice * item.qty).toFixed(2)}</span>
                        <span class="text-4xl font-bold text-gray-800 ${item.checked ? 'line-through text-gray-300' : ''}">${item.name}</span>
                    </div>
                    <div class="card-bottom">
                        <div class="drag-handle text-gray-300 text-3xl ${isLocked ? 'hidden' : ''}">⠿</div>
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${index})" class="w-10 h-10 rounded-xl accent-indigo-600 border-2">
                        <div class="qty-box">
                            <button onclick="removeItem(${index})" class="delete-item-btn">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                            <button onclick="updateQty(${index}, -1)" class="text-red-500 text-3xl font-bold px-2">-</button>
                            <span class="text-3xl font-bold text-gray-700 mx-2">${item.qty}</span>
                            <button onclick="updateQty(${index}, 1)" class="text-green-500 text-3xl font-bold px-2">+</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
            calculate();
            initSort();
        }

        function calculate() {
            const total = shoppingList.reduce((acc, i) => acc + (i.unitPrice * i.qty), 0);
            const paid = shoppingList.filter(i => i.checked).reduce((acc, i) => acc + (i.unitPrice * i.qty), 0);
            document.getElementById('totalSum').innerText = total.toFixed(2);
            document.getElementById('paidSum').innerText = paid.toFixed(2);
        }

        function saveAndRender() { localStorage.setItem('LIST_FINAL_V1', JSON.stringify(shoppingList)); render(); }
        function toggleCheck(index) { shoppingList[index].checked = !shoppingList[index].checked; saveAndRender(); }
        function updateQty(index, val) { if (shoppingList[index].qty + val >= 1) { shoppingList[index].qty += val; saveAndRender(); } }
        function removeItem(index) { shoppingList.splice(index, 1); saveAndRender(); }
        
        function toggleLock() {
            isLocked = !isLocked;
            const tag = document.getElementById('statusTag');
            tag.innerText = isLocked ? "נעול" : "מצב עריכה";
            tag.className = isLocked ? "text-gray-400 bg-gray-50 px-3 py-1 rounded-full text-xs font-bold w-fit mt-1" : "text-orange-500 bg-orange-50 px-3 py-1 rounded-full text-xs font-bold w-fit mt-1";
            render();
        }

        function initSort() {
            const el = document.getElementById('itemsList');
            if (sortableInstance) sortableInstance.destroy();
            if (!isLocked) {
                sortableInstance = Sortable.create(el, {
                    handle: '.drag-handle', animation: 150,
                    onEnd: () => {
                        let newArr = [];
                        document.querySelectorAll('.item-card').forEach(c => {
                            const item = shoppingList.find(i => i.id === c.dataset.id);
                            if (item) newArr.push(item);
                        });
                        shoppingList = newArr;
                        localStorage.setItem('LIST_FINAL_V1', JSON.stringify(shoppingList));
                    }
                });
            }
        }
        render();
    </script>
</body>
</html>
